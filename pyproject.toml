[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscope"
version = "0.3.0"
description = "PhishScope — email and phishing forensics (v0.3: SPF/DKIM/DMARC authentication analysis (offline))"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pouya Shini Karim"}]
keywords = ["forensics", "dfir", "email-forensics", "phishing", "mime", "cli", "blue-team"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/REV3R5ED/PhishScope"
Issues = "https://github.com/REV3R5ED/PhishScope/issues"
Changelog = "https://github.com/REV3R5ED/PhishScope/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
phishscope = "phishscope.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=phishscope --cov-report=term-missing"

[tool.coverage.run]
source = ["phishscope"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise AssertionError",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# line-length is inherited from [tool.ruff]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
